name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Compile
        run: |
          mkdir out
          find src -name "*.java" > sources.txt
          javac -d out @sources.txt
          cp -r data web out/
      - name: Self test
        working-directory: out
        run: java -Dsentiment.data=/tmp/sentiment-test-data -cp . sentiment.test.EngineSelfTest
